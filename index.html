<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Tracker</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .weather-card {
            background: #1a1a1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
            border: 1px solid #2a2a30;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Color states based on user interaction */
        .ip-mode { background: #3b82f6; color: #ffffff; }       /* Blue for initial scan */
        .gps-mode { background: #10b981; color: #ffffff; }      /* Green for high precision tracking */
        .fallback-mode { background: #f59e0b; color: #ffffff; }  /* Amber if denied safely */

        h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        h1 {
            font-size: 64px;
            margin: 10px 0;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 25px;
            text-transform: capitalize;
        }

        button {
            background: #ffffff;
            color: #121214;
            border: none;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #e4e4e7;
        }

        button:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
        }
    </style>
</head>

        <p id="condition-display">Gathering atmospheric metrics...</p>

        <button id="action-btn" onclick="triggerPinpointLocation()">Update Precision Weather</button>
    </div>
